<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Tier List</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #18181b;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .tier-board {
      width: 100%;
      max-width: 800px;
      border: 2px solid #27272a;
      background-color: #121214;
      margin-bottom: 20px;
    }

    .tier-row {
      display: flex;
      min-height: 80px;
      border-bottom: 2px solid #27272a;
    }

    .tier-row:last-child {
      border-bottom: none;
    }

    .tier-label {
      width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #18181b;
      flex-shrink: 0;
      user-select: none;
    }

    /*Colors*/
    .tier-s { background-color: #ff7f7f; }
    .tier-a { background-color: #ffbf7f; }
    .tier-b { background-color: #ffdf7f; }
    .tier-c { background-color: #ffff7f; }
    .tier-d { background-color: #bfff7f; }

    .tier-content, .item-pool {
      flex-grow: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      align-items: center;
    }

    .item-pool {
      width: 100%;
      max-width: 800px;
      min-height: 100px;
      background-color: #27272a;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .draggable-item {
      padding: 12px 16px;
      background-color: #3f3f46;
      border: 1px solid #52525b;
      border-radius: 4px;
      cursor: grab;
      font-weight: 500;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .draggable-item:active {
      cursor: grabbing;
    }

    .draggable-item.dragging {
      opacity: 0.5;
    }

    .drag-over {
      background-color: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <h1>My Tier List</h1>

  <!-- Tier List Rows -->
  <div class="tier-board">
    <div class="tier-row">
      <div class="tier-label tier-s">S</div>
      <div class="tier-content drop-zone"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-a">A</div>
      <div class="tier-content drop-zone"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-b">B</div>
      <div class="tier-content drop-zone"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-c">C</div>
      <div class="tier-content drop-zone"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label tier-d">D</div>
      <div class="tier-content drop-zone"></div>
    </div>
  </div>

  <!-- Unranked Item Pool -->
  <div class="item-pool drop-zone">
    <div class="draggable-item" draggable="true">HTML</div>
    <div class="draggable-item" draggable="true">CSS</div>
    <div class="draggable-item" draggable="true">JavaScript</div>
    <div class="draggable-item" draggable="true">Python</div>
    <div class="draggable-item" draggable="true">TypeScript</div>
    <div class="draggable-item" draggable="true">Rust</div>
  </div>

  <script>
    const items = document.querySelectorAll('.draggable-item');
    const dropZones = document.querySelectorAll('.drop-zone');
    let draggedItem = null;

    // Handle drag start and end on items
    items.forEach(item => {
      item.addEventListener('dragstart', () => {
        draggedItem = item;
        setTimeout(() => item.classList.add('dragging'), 0);
      });

      item.addEventListener('dragend', () => {
        draggedItem = null;
        item.classList.remove('dragging');
      });
    });

    // Handle dragover and drop on tier rows and item pool
    dropZones.forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault(); // Necessary to allow dropping
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('drag-over');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (draggedItem) {
          zone.appendChild(draggedItem);
        }
      });
    });
  </script>

</body>
</html>
